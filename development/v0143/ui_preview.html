    function executionPlanPanel(){const execution=latest?.execution||{},job=(execution.jobs||[])[0],wake=execution.wake||{},live=latest?.app?.mode==='live';return `<section class="quiet-panel execution-panel"><h2>${t('execution')}</h2><div class="result-row"><span>${t('executionMode')}</span><strong>${execution.mode==='WAKE_ENABLED_LOCAL'?t('wakeLocal'):t('localOnly')}</strong></div><div class="result-row"><span>${t('networkState')}</span><strong>${esc(execution.network||'—')}</strong></div><div class="result-row"><span>${t('wakeCapability')}</span><strong>${esc(wake.taskScheduler||'—')}</strong></div><div class="result-row"><span>${t('executionRisk')}</span><strong>${execution.mode==='LOCAL_ONLY'?'HIGH':'CONDITIONAL'}</strong></div><p class="caption">${t('wakeUncertain')}</p>${live?`<p class="warning-note">${t('executionPreview')}</p>`:''}<label class="field">${t('fallbackMinutes')}<select id="execution-fallback"><option value="1">1 min</option><option value="15">15 min</option><option value="30">30 min</option></select></label><div class="execution-job">${job?`<span class="activity-status" data-tone="${tone(job.status)}">${esc(job.status)}</span><p>${esc(dt(job.targetExecutionAt))}${job.errorCode?` · ${esc(job.errorCode)}`:''}</p>${job.status==='MISSED'?`<a href="#plan" class="subtle-link">${t('recalculate')}</a>`:''}${['PLANNED','AUTHORIZED','WAITING','READY','WAKE_PENDING','PREFLIGHT'].includes(job.status)?`<button class="button secondary small" type="button" data-execution-cancel="${esc(job.jobId)}">${t('cancelJob')}</button>`:''}`:t('noExecutionJob')}</div><p class="caption">${t('noAutoRetry')}</p></section>`}

    settings=()=>{const x=latest?.execution||{},mode=x.mode||'LOCAL_ONLY';const section=`<section class="settings-section"><h2>${t('execution')}</h2><div class="settings-row"><label class="field">${t('executionMode')}<select id="execution-mode"><option value="LOCAL_ONLY" ${mode==='LOCAL_ONLY'?'selected':''}>${t('localOnly')}</option><option value="WAKE_ENABLED_LOCAL" ${mode==='WAKE_ENABLED_LOCAL'?'selected':''}>${t('wakeLocal')}</option></select></label></div><div class="settings-row"><span>${t('wakeCapability')}</span><strong>${esc(x.wake?.taskScheduler||'—')}</strong></div><p class="caption">${t('wakeUncertain')}</p><p class="caption">${t('executionPreview')}</p><button type="button" class="button secondary small" id="test-wake-setup">${t('testWake')}</button></section>`;return baseSettings().replace(`<section class="settings-section"><h2>${t('dangerZone')}</h2>`,section+`<section class="settings-section"><h2>${t('dangerZone')}</h2>`)};
    const baseExecutionSettings=settings;

    Object.assign(catalog.zh,{confirmedTrials:'已确认实验',moreTrials:'样本量不足，尚不能估计可靠性。',viewEvidence:'查看证据',expectedReset:'预期重置',observedReset:'观测重置',previousState:'先前状态',newState:'新状态',detectedAt:'检测时间',correlatedRequest:'关联请求',attribution:'归因',rawSources:'原始来源数',lastTransition:'最近转换',realExecution:'真实执行',pendingRealJobs:'待执行真实任务',allowUnknownRetry:'未知结果自动重试',evidenceStore:'证据存储',experimentEvaluator:'实验判定器',eventDedup:'事件去重'});

    const baseEvidenceAnchor=anchorTab;

    const baseEvidenceDiagnostics=diagnostics;
    diagnostics=()=>{const x=latest?.execution||{},d=latest?.diagnostics||{};const rows=diagnosticRow(t('experimentEvaluator'),d.experimentEvaluator)+diagnosticRow(t('eventDedup'),d.eventDedup)+diagnosticRow(t('evidenceStore'),d.evidenceStore)+diagnosticRow(t('realExecution'),x.liveExecutionEnabled?'ON':'OFF')+diagnosticRow(t('pendingRealJobs'),x.pendingRealJobs??0);return baseEvidenceDiagnostics().replace('<div class="button-row" style="margin-top:24px">',`<div class="diag-grid execution-diag">${rows}</div><div class="button-row" style="margin-top:24px">`)};
    const baseEvidenceSettings=settings;
    settings=()=>{const x=latest?.execution||{};return baseEvidenceSettings().replace(`<p class="caption">${t('liveWarning')}</p>`,`<div class="result-row"><span>${t('realExecution')}</span><strong>${x.liveExecutionEnabled?'ON':'OFF'}</strong></div><div class="result-row"><span>${t('allowUnknownRetry')}</span><strong>OFF</strong></div><p class="caption">${t('liveWarning')}</p>`)};
    function setup(){const flags=latest?.setup?.steps||{},steps=[['detect','detect'],['connect','connect'],['account','account'],['quota','quota'],['ready','ready']];return `<div class="wizard-shell"><div class="wizard-head"><span class="brand-mark" style="margin:auto auto 16px">QL</span><div class="eyebrow">${t('firstRun')}</div><h1>${t('welcome')}</h1><p>${t('setupGuide')}</p></div><div class="wizard-steps">${steps.map(([key,label])=>`<div class="wizard-step" data-ready="${key==='ready'?!!latest?.setup?.ready:!!flags[key]}">${t(label)}</div>`).join('')}</div><div class="surface" style="padding:24px"><form id="codex-path-form"><label class="field">${t('cliPath')}<input id="manual-codex-path" type="text" autocomplete="off" placeholder="C:\...\codex.exe"></label><button type="submit" class="button secondary" style="margin-top:14px">${t('validatePath')}</button></form><div class="button-row" style="margin-top:24px"><button type="button" class="button secondary" id="setup-retry">${t('retryDetect')}</button><button type="button" class="button" id="enter-dashboard" ${latest?.setup?.ready?'':'disabled'}>${t('enterDashboard')}</button></div></div></div>`}
    function updateChrome(){document.documentElement.lang=locale==='zh'?'zh-CN':'en';document.documentElement.dataset.theme=theme;document.title=`${t(current)} · QuotaLab`;$('#breadcrumb-page').textContent=t(current);$('#footer-local').textContent=locale==='zh'?'数据保留在本机。':'Data stays on this computer.';$$('[data-nav]').forEach(node=>{const active=node.dataset.nav===current;if(node.classList.contains('nav-link')){if(active)node.setAttribute('aria-current','page');else node.removeAttribute('aria-current');const text=$('.nav-text',node);if(text)text.textContent=t(node.dataset.nav);node.setAttribute('aria-label',t(node.dataset.nav));node.setAttribute('title',t(node.dataset.nav))}});$('#status').dataset.status=latest?.status||'';$('#status-text').textContent=latest?.status==='LIVE'?t('live'):latest?.status==='MOCK DATA'?t('mock'):latest?.error?t('unavailable'):t('disconnected');$('#sidebar-connection').textContent=latest?.app_server==='CONNECTED'||latest?.app_server==='MOCK'?t('connected'):t('disconnected');$('#sidebar-dot').style.background=latest?.app_server==='CONNECTED'?'var(--success)':latest?.app_server==='MOCK'?'var(--warning)':'var(--text-muted)';$('#sidebar-plan').textContent=latest?.account?.plan_type?`${t('plan')}: ${latest.account.plan_type.toUpperCase()}`:'—';$('#lang-zh').setAttribute('aria-pressed',String(locale==='zh'));$('#lang-en').setAttribute('aria-pressed',String(locale==='en'))}
    function render(){updateChrome();const target=$('#page-content');if(!latest){const loading=current==='overview'?`<div class="quota-layout"><div class="surface hero-quota skeleton-card"><div class="skeleton-box"></div><div class="skeleton-box large"></div><div class="skeleton-box"></div></div><div class="surface secondary-quota skeleton-card"><div class="skeleton-box"></div><div class="skeleton-box large"></div></div></div>`:`<div class="surface loading-panel" role="status" aria-live="polite"><div class="skeleton-box"></div><div class="skeleton-box"></div><div class="skeleton-box"></div></div>`;target.innerHTML=`${pageHead(t(current),current==='overview'?t('overviewDescription'):t(current))}${loading}`;return}const page=latest.setup?.completed===false?setup:({overview,plan,activity,lab,diagnostics,settings}[current]||overview);const redraw=lastPage!==current||current!=='plan'||!$('#intensity-form');if(redraw)target.innerHTML=page();lastPage=current;lastTab=labTab;if(current==='plan')planPreview();updateTickers()}
    function updateTickers(){$$('[data-reset]').forEach(node=>{node.textContent=countdown(node.dataset.reset)})}
    function navigate(){const target=location.hash.replace('#','');current=['overview','plan','activity','lab','diagnostics','settings'].includes(target)?target:'overview';render();$('#main').focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'});closeMenu()}
    function closeMenu(){$('#sidebar').classList.remove('open');$('#sidebar-backdrop').classList.remove('open');$('#mobile-menu').setAttribute('aria-expanded','false')}
    function setLanguage(value){locale=value==='en'?'en':'zh';localStorage.setItem('quotalab_locale',locale);lastPage='';render()}
    function toggleTheme(){theme=theme==='dark'?'light':'dark';localStorage.setItem('quotalab_theme',theme);render()}
    async function post(path,payload={}){const response=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const result=await response.json();if(!response.ok){const error=new Error(result.error||`HTTP ${response.status}`);error.status=response.status;throw error}return result}
    async function refresh(){try{const response=await fetch('/api/status',{cache:'no-store'});if(!response.ok)throw new Error(`HTTP ${response.status}`);latest=await response.json();render()}catch(error){latest=latest||{windows:[],setup:{completed:true}};latest.status='UNAVAILABLE';latest.error=String(error);render()}}
    document.addEventListener('click',event=>{const summary=event.target.closest('#side-nav .nav-disclosure > summary'),shell=$('#app-shell');if(!summary||!shell?.classList.contains('compact-navigation'))return;event.preventDefault();const group=summary.parentElement;shell.classList.remove('collapsed');shell.classList.add('expanded');localStorage.setItem('quotalab_sidebar_collapsed','false');group.open=true;window.quotaLabSyncSidebarToggle?.()});
    document.addEventListener('click',async event=>{const target=event.target.closest('button,a');if(!target)return;try{
      if(target.id==='lang-zh'||target.dataset.language==='zh')setLanguage('zh');
      else if(target.id==='lang-en'||target.dataset.language==='en')setLanguage('en');

      else if(target.id==='mobile-menu'){const open=!$('#sidebar').classList.contains('open');$('#sidebar').classList.toggle('open',open);$('#sidebar-backdrop').classList.toggle('open',open);target.setAttribute('aria-expanded',String(open))}
      else if(target.id==='sidebar-backdrop')closeMenu();

      else if(target.dataset.labTab){labTab=target.dataset.labTab;render();$(`[data-lab-tab="${labTab}"]`).focus()}

      else if(target.dataset.action==='reconnect'){await post('/api/codex/reconnect');await refresh()}

    document.addEventListener('submit',async event=>{const form=event.target;if(!['intensity-form','plan-form','probe-form','codex-path-form','settings-codex-form'].includes(form.id))return;event.preventDefault();try{

    document.addEventListener('keydown',event=>{if(event.key==='Escape')closeMenu();if(current==='lab'&&event.target.matches('[data-lab-tab]')&&['ArrowRight','ArrowLeft'].includes(event.key)){event.preventDefault();const tabs=$$('[data-lab-tab]'),index=tabs.indexOf(event.target),next=(index+(event.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;labTab=tabs[next].dataset.labTab;render();$(`[data-lab-tab="${labTab}"]`).focus()}});
